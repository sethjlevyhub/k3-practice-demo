<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beginning Sounds · AIC Hybrid Learning</title><style>
@import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#FFF9E8;color:#2b3a40;font-family:Lexend,"Trebuchet MS",Arial,sans-serif;font-size:22px;min-height:100vh}
header{background:#417586;color:#FEFFF2;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:28px;flex:1}
.back{color:#2F6E80;background:#FEFFF2;border-radius:16px;padding:0 18px;min-height:64px;display:inline-flex;align-items:center;text-decoration:none;font-weight:600;font-size:20px}
main{max-width:900px;margin:0 auto;padding:20px}
.instr{background:#BBD0DA;border-radius:18px;padding:14px 18px;margin:0 0 18px;font-size:22px}
.card{background:#FEFFF2;border:3px solid #BBD0DA;border-radius:28px;padding:22px;text-align:center}
.btn{min-width:64px;min-height:64px;border:0;border-radius:20px;font:700 30px Lexend,Arial,sans-serif;background:#fff;color:#2F6E80;box-shadow:0 5px 0 #BBD0DA;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #BBD0DA}
.btn.primary{background:#417586;color:#FEFFF2;box-shadow:0 5px 0 #2a4d58;padding:0 26px;font-size:24px}
.btn.good{background:#CDEFD1}.btn.bad{background:#F9D3D0;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.grid{display:grid;gap:14px;justify-content:center}
.feedback{min-height:44px;font-size:26px;font-weight:700;margin:14px 0;color:#757563}
.feedback.ok{color:#2e7d4f}
.pics{font-size:56px;line-height:1.25;letter-spacing:6px;margin:8px 0 16px}
.speak{font-size:34px}
@media(max-width:500px){header h1{font-size:22px}body{font-size:20px}.pics{font-size:44px}}
.mode{display:flex;gap:10px;justify-content:center;margin-bottom:16px}.mode .btn{font-size:20px;padding:0 20px}.mode [aria-pressed=true]{background:#2F6E80;color:#FEFFF2}.choices{grid-template-columns:repeat(2,150px);margin-top:20px}.pic{height:140px;font-size:72px}
</style></head><body><header><a class="back" href="../index.html" aria-label="Back to all games">← Back to all games</a><h1>Beginning Sounds</h1></header>
<main><p class="instr">Tap 🔊 to hear the word. Then tap the picture that starts with the same sound.</p><div class="card"><div class="mode" role="group" aria-label="Mode"><button id="mP" class="btn" aria-pressed="true">Pictures</button><button id="mL" class="btn" aria-pressed="false">Letters</button></div><button id="hear" class="btn primary speak" aria-label="Play the sound">🔊 Hear it</button><div id="ch" class="grid choices" role="group" aria-label="Choices"></div><div id="fb" class="feedback" aria-live="polite"></div><button id="next" class="btn primary" hidden>Next ➜</button></div></main><script>
function say(t){try{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.rate=0.8;u.lang='en-US';speechSynthesis.speak(u)}catch(e){}}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

var D=[["b","ball","⚽","buh"],["s","sun","☀️","sss"],["m","moon","🌙","mmm"],["c","cat","🐱","kuh"],["d","dog","🐶","duh"],["f","fish","🐟","fff"],["p","pig","🐷","puh"],["t","tree","🌳","tuh"],["h","hat","🎩","huh"],["r","rain","🌧️","rrr"]],mode="P",ans,ch=document.getElementById("ch"),fb=document.getElementById("fb");
function round(){ans=D[Math.floor(Math.random()*D.length)];var opts=shuffle([ans].concat(shuffle(D.filter(d=>d!==ans)).slice(0,3)));ch.innerHTML="";fb.textContent="";fb.className="feedback";document.getElementById("next").hidden=true;
opts.forEach(o=>{var b=document.createElement("button");b.className="btn pic";b.textContent=mode==="P"?o[2]:o[0];b.setAttribute("aria-label",mode==="P"?o[1]:"Letter "+o[0]);b.onclick=()=>{if(o===ans){b.className="btn pic good";fb.textContent="Yes! "+ans[1]+" starts with "+ans[0].toUpperCase()+" 🎉";fb.className="feedback ok";say("Yes! "+ans[1]+" starts with "+ans[3]);document.getElementById("next").hidden=false}else{b.className="btn pic bad";fb.textContent="Listen again and try another!";say("Try again")}};ch.appendChild(b)})}
function play(){say(mode==="P"?ans[3]+"... "+ans[3]:ans[1]+"... "+ans[3])}
document.getElementById("hear").onclick=play;document.getElementById("next").onclick=()=>{round();play()};
function setM(m){mode=m;document.getElementById("mP").setAttribute("aria-pressed",m==="P");document.getElementById("mL").setAttribute("aria-pressed",m==="L");round()}
document.getElementById("mP").onclick=()=>setM("P");document.getElementById("mL").onclick=()=>setM("L");round();
</script></body></html>
