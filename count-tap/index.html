<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../icons/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AIC Practice"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#0f766e"><title>Count &amp; Tap · AIC Hybrid Learning</title><style>
@import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#FFF9E8;color:#2b3a40;font-family:Lexend,"Trebuchet MS",Arial,sans-serif;font-size:22px;min-height:100vh}
header{background:#417586;color:#FEFFF2;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:28px;flex:1}
.back{color:#2F6E80;background:#FEFFF2;border-radius:16px;padding:0 18px;min-height:64px;display:inline-flex;align-items:center;text-decoration:none;font-weight:600;font-size:20px}
main{max-width:900px;margin:0 auto;padding:20px}
.instr{background:#BBD0DA;border-radius:18px;padding:14px 18px;margin:0 0 18px;font-size:22px}
.card{background:#FEFFF2;border:3px solid #BBD0DA;border-radius:28px;padding:22px;text-align:center}
.btn{min-width:64px;min-height:64px;border:0;border-radius:20px;font:700 30px Lexend,Arial,sans-serif;background:#fff;color:#2F6E80;box-shadow:0 5px 0 #BBD0DA;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #BBD0DA}
.btn.primary{background:#417586;color:#FEFFF2;box-shadow:0 5px 0 #2a4d58;padding:0 26px;font-size:24px}
.btn.good{background:#CDEFD1}.btn.bad{background:#F9D3D0;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.grid{display:grid;gap:14px;justify-content:center}
.feedback{min-height:44px;font-size:26px;font-weight:700;margin:14px 0;color:#757563}
.feedback.ok{color:#2e7d4f}
.pics{font-size:56px;line-height:1.25;letter-spacing:6px;margin:8px 0 16px}
.speak{font-size:34px}
@media(max-width:500px){header h1{font-size:22px}body{font-size:20px}.pics{font-size:44px}}
#nums{margin:0 auto}@media(max-width:500px){#nums{grid-template-columns:repeat(5,60px)!important}#nums .btn{min-width:60px;font-size:26px}}
</style></head><body><header><a class="back" href="../index.html" aria-label="Home: all games">🏠 Home</a><h1>Count &amp; Tap</h1></header>
<main><p class="instr">Count the pictures. Tap the number that matches!</p><div class="card"><div id="pics" class="pics" role="img"></div><div id="nums" class="grid" style="grid-template-columns:repeat(5,72px)" role="group" aria-label="Number choices"></div><div id="fb" class="feedback" aria-live="polite"></div><button id="next" class="btn primary" hidden>Next ➜</button></div></main><script src="../audio/voice.js?v=4"></script><script>
function say(t){try{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.rate=0.8;u.lang='en-US';speechSynthesis.speak(u)}catch(e){}}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

var E=["🍎","⭐","🐟","🌼","🐞","🎈","🐥","🍓"],n,nums=document.getElementById("nums"),fb=document.getElementById("fb"),nx=document.getElementById("next"),pics=document.getElementById("pics");
for(let i=1;i<=10;i++){let b=document.createElement("button");b.className="btn";b.textContent=i;b.setAttribute("aria-label","Number "+i);b.onclick=()=>pick(b,i);nums.appendChild(b)}
function round(){n=1+Math.floor(Math.random()*10);var e=E[Math.floor(Math.random()*E.length)];pics.textContent=e.repeat(n);pics.setAttribute("aria-label","Pictures to count");fb.textContent="";fb.className="feedback";nx.hidden=true;nums.querySelectorAll("button").forEach(b=>{b.className="btn";b.disabled=false})}
function pick(b,i){if(i===n){b.className="btn good";fb.textContent="Yes! "+n+" 🎉";fb.className="feedback ok";sayClips(["yes",numClip(n),praise()],"Yes! "+n+"! Great job!");nums.querySelectorAll("button").forEach(x=>x.disabled=true);nx.hidden=false}else{b.className="btn bad";fb.textContent="Try again — count slowly!";sayClips(["count-again"],"Let's count again, nice and slow.")}}
nx.onclick=round;round();
</script><script>if('serviceWorker'in navigator){navigator.serviceWorker.register('../sw.js',{scope:'/k3-practice-demo/',updateViaCache:'none'}).then(function(r){r.update()});var h=!!navigator.serviceWorker.controller,d=false;navigator.serviceWorker.addEventListener('controllerchange',function(){if(h&&!d){d=true;location.reload()}h=true})}</script></body></html>
